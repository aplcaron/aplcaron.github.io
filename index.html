            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;

        .call-button:hover {

        }
        
        .timer {
            font-size: 24px;
            color: #d32f2f;
            font-weight: bold;
            margin: 15px 0;
